<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Дитячий садочок у м. Покров</title>
    <style>
        :root { --primary: #FF7F50; --secondary: #4CAF50; --bg: #fdf6e3; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg); margin: 0; display: flex; align-items: center; justify-content: center; min-height: 100vh; text-align: center; }
        .container { background: white; padding: 40px; border-radius: 30px; box-shadow: 0 15px 35px rgba(0,0,0,0.1); max-width: 500px; width: 90%; }
        h1 { color: var(--primary); font-size: 2.5em; margin-bottom: 10px; }
        p { color: #555; font-size: 1.1em; line-height: 1.6; }
        .emoji { font-size: 3em; margin-bottom: 20px; }
        .btn { display: inline-block; background: #0088cc; color: white; padding: 18px 30px; border-radius: 50px; text-decoration: none; font-weight: bold; font-size: 1.2em; transition: transform 0.2s, background 0.2s; box-shadow: 0 5px 15px rgba(0,136,204,0.3); }
        .btn:hover { transform: scale(1.05); background: #0077b5; }
        .footer { margin-top: 30px; font-size: 0.8em; color: #aaa; }
    </style>
</head>
<body>
    <div class="container">
        <div class="emoji">🧸🎨🍎</div>
        <h1>Дитячий садочок</h1>
        <p>Вітаємо! Ми створюємо найкращий простір для розвитку та ігор вашої дитини у місті Покров.</p>
        <p>Для запису, перевірки балансу або зв'язку з адміністрацією скористайтеся нашим Telegram-ботом:</p>
        <br>
        <a href="https://t.me/БОТ" class="btn">🤖 ВІДКРИТИ БОТ</a>
        <div class="footer">м. Покров, 2026</div>
    </div>
</body>
</html>
