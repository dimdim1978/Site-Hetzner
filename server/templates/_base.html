<!doctype html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>{% block title %}Адмінка{% endblock %} · ГПД «Берегиня»</title>
<style>
:root{
  --green:#2F6F4E;--green-dark:#255A3E;--green-soft:#EAF2ED;
  --ink:#101828;--ink-2:#475467;--ink-3:#667085;
  --line:#E4E7EC;--bg:#FFFFFF;--bg-soft:#FAFAF7;
  --err:#B42318;--err-soft:#FEF3F2;--warn:#B54708;--warn-soft:#FFFAEB;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  font-size:16px;line-height:1.5;color:var(--ink);background:var(--bg-soft)}
a{color:var(--green)}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px 56px}

.topbar{background:var(--green);color:#fff;padding:0}
.topbar .in{max-width:1080px;margin:0 auto;padding:14px 20px;display:flex;
  justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}
.topbar .t-name{font-weight:700;font-size:17px}
.topbar .t-right{display:flex;align-items:center;gap:16px;font-size:14px}
.topbar a{color:#fff;text-decoration:none;opacity:.9}
.topbar a:hover{opacity:1;text-decoration:underline}
.topbar .who{opacity:.8}

h1{font-size:24px;margin:28px 0 4px;letter-spacing:-.01em}
.sub{color:var(--ink-3);font-size:14px;margin-bottom:20px}

.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:20px;margin-bottom:16px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;
  min-height:42px;padding:10px 18px;border:0;border-radius:8px;cursor:pointer;
  font-family:inherit;font-size:15px;font-weight:600;text-decoration:none}
.btn.primary{background:var(--green);color:#fff}
.btn.primary:hover{background:var(--green-dark)}
.btn.ghost{background:#fff;color:var(--ink-2);border:1px solid var(--line)}
.btn.ghost:hover{border-color:var(--ink-3)}

.pill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.st-нова{background:var(--green-soft);color:var(--green)}
.st-зарахована{background:#ECFDF3;color:#027A48}
.st-архів{background:#F2F4F7;color:var(--ink-3)}
.nofoto{background:var(--err-soft);color:var(--err)}
.alrg{background:var(--warn-soft);color:var(--warn)}
.pill.pr-ГПД{background:var(--green-soft);color:var(--green)}
.pill.pr-НМТ{background:#EFF4FF;color:#3538CD}

input[type=text],input[type=search],input[type=password],select,textarea{
  font-family:inherit;font-size:16px;color:var(--ink);background:#fff;
  border:1px solid #D0D5DD;border-radius:8px;padding:10px 12px;min-height:44px;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--green);outline-offset:2px;border-color:var(--green)}
textarea{min-height:80px;resize:vertical}
</style>
</head>
<body>
<div class="topbar">
  <div class="in">
    <div class="t-name">ГПД «Берегиня» · адмінка</div>
    <div class="t-right">
      <a href="/admin">Заявки</a>
      <span class="who">{{ who }}</span>
      <a href="/api/logout">Вийти</a>
    </div>
  </div>
</div>
<div class="wrap">
{% block body %}{% endblock %}
</div>
</body>
</html>
